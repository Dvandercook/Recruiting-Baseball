<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>2028 Recruiting Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1720;
    --panel:#182430;
    --panel-2:#1F2E3C;
    --line: rgba(244,241,232,0.08);
    --chalk:#F4F1E8;
    --chalk-dim:#B9C2CA;
    --slate:#7E8B97;
    --turf:#4C8C5B;
    --turf-dim: rgba(76,140,91,0.18);
    --dirt:#C17A3B;
    --dirt-dim: rgba(193,122,59,0.18);
    --gold:#E4B44B;
    --gold-dim: rgba(228,180,75,0.16);
    --danger:#C1543B;
    --commit:#4F9FE0;
    --commit-dim: rgba(79,159,224,0.16);
    --violet:#8A5CD0;
    --violet-dim: rgba(138,92,208,0.16);
    --elsewhere:#3E6E92;
    --elsewhere-dim: rgba(62,110,146,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--chalk);font-family:'Inter',system-ui,sans-serif;}
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  /* ---- top bar ---- */
  .topbar{
    display:flex;align-items:center;gap:20px;
    padding:14px 22px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, #131C25, #0F1720);
    flex-shrink:0;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand svg{width:26px;height:26px;flex-shrink:0;}
  .brand h1{
    font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:0.03em;
    font-size:19px;text-transform:uppercase;margin:0;color:var(--chalk);
  }
  .brand .yr{color:var(--dirt);}
  .topbar .sub{color:var(--slate);font-size:12px;margin-left:2px;padding-left:14px;border-left:1px solid var(--line);}
  .search-wrap{margin-left:auto;position:relative;width:280px;}
  .search-wrap input{
    width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--chalk);
    padding:9px 12px 9px 34px;border-radius:6px;font-size:13px;font-family:inherit;
  }
  .search-wrap input:focus{outline:none;border-color:var(--turf);}
  .search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--slate);}
  .count-pill{
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--slate);
    background:var(--panel-2);border:1px solid var(--line);padding:6px 10px;border-radius:5px;
  }
  /* ---- layout ---- */
  .layout{display:flex;flex:1;min-height:0;}
  /* ---- position sidebar ---- */
  .sidebar{
    width:210px;flex-shrink:0;border-right:1px solid var(--line);
    background:var(--panel);overflow-y:auto;padding:14px 10px;
  }
  .group-toggle{
    display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;
    padding:3px;margin:0 6px 14px;gap:3px;
  }
  .gt-btn{
    flex:1;background:none;border:none;color:var(--slate);font-family:'Inter',sans-serif;
    font-size:11.5px;font-weight:600;padding:7px 0;border-radius:5px;cursor:pointer;
  }
  .gt-btn.active{background:var(--turf);color:#08150b;}
  .gt-btn:not(.active):hover{color:var(--chalk);}
  .pos-tab .tdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--slate);}
  .pos-tab .tdot.gold{background:var(--gold);}
  .pos-tab .tdot.turf{background:var(--turf);}
  .pos-tab .tdot.slate{background:var(--chalk-dim);}
  .pos-tab .tdot.danger{background:var(--danger);}
  .pos-tab .tdot.commit{background:var(--commit);}
  .pos-tab .tdot.violet{background:var(--violet);}
  .pos-tab .tdot.elsewhere{background:var(--elsewhere);}
  .pos-tab .tdot.dirt{background:var(--dirt);}
  .sidebar-label{
    font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:0.12em;
    text-transform:uppercase;color:var(--slate);padding:0 8px 10px;
  }
  .pos-tab{
    display:flex;align-items:center;gap:10px;width:100%;
    background:none;border:none;color:var(--chalk-dim);cursor:pointer;
    padding:9px 8px;border-radius:6px;font-family:inherit;font-size:13.5px;
    text-align:left;margin-bottom:2px;position:relative;
  }
  .pos-tab:hover{background:var(--panel-2);}
  .pos-tab.active{background:var(--turf-dim);color:var(--chalk);}
  .pos-tab.active .plate{fill:var(--turf);}
  .pos-tab .plate{width:13px;height:13px;flex-shrink:0;fill:var(--slate);}
  .pos-tab .plabel{font-weight:600;letter-spacing:0.02em;width:38px;flex-shrink:0;}
  .pos-tab .pcount{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--slate);}
  .pos-tab.active .pcount{color:var(--turf);}
  /* ---- main list ---- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .list-header{
    display:flex;align-items:baseline;gap:12px;padding:20px 26px 12px;flex-shrink:0;
  }
  .list-header h2{
    font-family:'Oswald',sans-serif;font-size:26px;text-transform:uppercase;
    letter-spacing:0.02em;margin:0;font-weight:600;
  }
  .list-header .tagline{color:var(--slate);font-size:12.5px;}
  .col-heads{
    display:grid;grid-template-columns:52px 1.6fr 1.2fr 1fr 136px;gap:14px;
    padding:0 26px 8px;color:var(--slate);font-size:10.5px;letter-spacing:0.08em;
    text-transform:uppercase;flex-shrink:0;
  }
  .roster{overflow-y:auto;padding:0 26px 26px;flex:1;}
  .row{
    display:grid;grid-template-columns:52px 1.6fr 1.2fr 1fr 136px;gap:14px;align-items:center;
    padding:10px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent;
    margin-bottom:4px;
  }
  .row:hover{background:var(--panel-2);border-color:var(--line);}
  .rank-badge{
    width:38px;height:38px;border-radius:50%;background:var(--panel-2);
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;color:var(--chalk-dim);
  }
  .rank-badge.tier-gold{background:var(--gold-dim);border-color:var(--gold);color:var(--gold);}
  .rank-badge.tier-turf{background:var(--turf-dim);border-color:var(--turf);color:var(--turf);}
  .rank-badge.tier-slate{background:var(--panel-2);border-color:var(--slate);color:var(--chalk-dim);}
  .rank-badge.tier-danger{background:rgba(193,84,59,0.16);border-color:var(--danger);color:var(--danger);}
  .rank-badge.tier-commit{background:var(--commit-dim);border-color:var(--commit);color:var(--commit);}
  .rank-badge.tier-dirt{background:var(--dirt-dim);border-color:var(--dirt);color:var(--dirt);}
  .rank-badge.tier-violet{background:var(--violet-dim);border-color:var(--violet);color:#B08FE8;}
  .rank-badge.tier-elsewhere{background:var(--elsewhere-dim);border-color:var(--elsewhere);color:#7FADCE;}
  .row.tier-danger,.row.tier-violet,.row.tier-elsewhere{opacity:0.6;}
  .name-cell{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .name-cell .nm{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:6px;}
  .name-cell .meta{font-size:11.5px;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .star{width:12px;height:12px;fill:var(--gold);flex-shrink:0;}
  .posd{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--chalk-dim);}
  .cell-txt{font-size:12.5px;color:var(--chalk-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cell-txt.dim{color:var(--slate);}
  .row-actions{display:flex;gap:6px;justify-content:flex-end;}
  .icon-btn{
    width:26px;height:26px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--slate);text-decoration:none;
  }
  .icon-btn svg{width:13px;height:13px;}
  .icon-btn:hover{color:var(--chalk);border-color:var(--slate);}
  .empty-state{color:var(--slate);text-align:center;padding:60px 20px;font-size:13px;}
  /* ---- drawer ---- */
  .scrim{
    position:fixed;inset:0;background:rgba(6,10,14,0.6);opacity:0;pointer-events:none;
    transition:opacity .18s ease;z-index:20;
  }
  .scrim.show{opacity:1;pointer-events:auto;}
  .drawer{
    position:fixed;top:0;right:0;height:100vh;width:420px;max-width:92vw;
    background:var(--panel);border-left:1px solid var(--line);
    transform:translateX(100%);transition:transform .22s ease;z-index:21;
    display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,0.35);
  }
  .drawer.show{transform:translateX(0);}
  .drawer-head{
    padding:22px 24px 16px;border-bottom:1px solid var(--line);flex-shrink:0;position:relative;
    background:linear-gradient(180deg,#1B2833,var(--panel));
  }
  .drawer-close{
    position:absolute;top:18px;right:18px;width:28px;height:28px;border-radius:6px;
    background:var(--panel-2);border:1px solid var(--line);color:var(--slate);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .drawer-close:hover{color:var(--chalk);}
  .dh-name{font-family:'Oswald',sans-serif;font-size:24px;font-weight:600;text-transform:uppercase;
    margin:0 0 4px;padding-right:30px;display:flex;align-items:center;gap:8px;}
  .dh-sub{color:var(--slate);font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .badge{
    display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;
    letter-spacing:0.05em;text-transform:uppercase;padding:3px 8px;border-radius:20px;
  }
  .badge.gold{background:var(--gold-dim);color:var(--gold);border:1px solid rgba(228,180,75,0.4);}
  .badge.turf{background:var(--turf-dim);color:var(--turf);border:1px solid rgba(76,140,91,0.4);}
  .badge.slate{background:var(--panel-2);color:var(--chalk-dim);border:1px solid var(--line);}
  .badge.danger{background:rgba(193,84,59,0.16);color:var(--danger);border:1px solid rgba(193,84,59,0.4);}
  .badge.commit{background:var(--commit-dim);color:var(--commit);border:1px solid rgba(79,159,224,0.4);}
  .badge.dirt{background:var(--dirt-dim);color:var(--dirt);border:1px solid rgba(193,122,59,0.4);}
  .badge.violet{background:var(--violet-dim);color:#B08FE8;border:1px solid rgba(138,92,208,0.4);}
  .badge.elsewhere{background:var(--elsewhere-dim);color:#7FADCE;border:1px solid rgba(62,110,146,0.45);}
  .drawer-body{overflow-y:auto;flex:1;padding:20px 24px 30px;}
  .field-group{margin-bottom:22px;}
  .fg-label{
    font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;
    color:var(--dirt);margin-bottom:10px;display:flex;align-items:center;gap:8px;
  }
  .fg-label::after{content:"";flex:1;height:1px;background:var(--line);}
  .fact-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;}
  .fact{font-size:13px;}
  .fact .k{color:var(--slate);font-size:11px;display:block;margin-bottom:4px;}
  .fact .v{color:var(--chalk);}
  .fact .v a{color:var(--turf);text-decoration:none;}
  .fact .v a:hover{text-decoration:underline;}
  .fact .v-input{
    width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--chalk);
    font-family:inherit;font-size:13px;padding:7px 9px;border-radius:6px;
  }
  .fact .v-input:focus{outline:none;border-color:var(--turf);}
  .fact .v-input::placeholder{color:var(--slate);}
  .fact.full{grid-column:1/-1;}
  .fact .link-row{display:flex;gap:6px;align-items:center;}
  .fact .link-row .v-input{flex:1;min-width:0;}
  .open-link{
    flex-shrink:0;border:1px solid var(--line);background:var(--panel-2);color:var(--slate);
    border-radius:6px;padding:7px 10px;font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;
    letter-spacing:0.04em;text-transform:uppercase;
  }
  .open-link:hover:not(:disabled){color:var(--turf);border-color:var(--turf);}
  .open-link.site-btn{color:var(--slate);}
  .open-link.site-btn:hover{color:var(--commit);border-color:var(--commit);}
  .open-link[hidden]{display:none;}
  .open-link[data-mode=find]{color:var(--dirt);border-color:rgba(193,122,59,0.4);}
  .open-link[data-mode=find]:hover{color:var(--gold);border-color:var(--gold);}
  .icon-btn.tag-btn{
    width:auto;padding:0 7px;font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;
    letter-spacing:0.03em;
  }
  .icon-btn.pg:hover{color:var(--gold);border-color:var(--gold);}
  .icon-btn.pbr:hover{color:var(--dirt);border-color:var(--dirt);}
  .tier-picker{display:flex;flex-direction:column;gap:6px;}
  .tier-opt{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    padding:10px 12px;cursor:pointer;color:var(--chalk-dim);font-family:inherit;
  }
  .tier-opt .to-num{
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;
    width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:var(--bg);border:1px solid var(--line);flex-shrink:0;color:inherit;
  }
  .tier-opt .to-label{font-size:13px;}
  .tier-opt:hover{border-color:var(--slate);}
  .tier-opt.active{color:var(--chalk);}
  .tier-opt.tier-gold.active{border-color:var(--gold);background:var(--gold-dim);}
  .tier-opt.tier-gold.active .to-num{background:var(--gold);color:#1a1406;border-color:var(--gold);}
  .tier-opt.tier-turf.active{border-color:var(--turf);background:var(--turf-dim);}
  .tier-opt.tier-turf.active .to-num{background:var(--turf);color:#08150b;border-color:var(--turf);}
  .tier-opt.tier-slate.active{border-color:var(--slate);background:var(--panel-2);}
  .tier-opt.tier-slate.active .to-num{background:var(--slate);color:#0c1116;border-color:var(--slate);}
  .tier-opt.tier-danger.active{border-color:var(--danger);background:rgba(193,84,59,0.16);}
  .tier-opt.tier-danger.active .to-num{background:var(--danger);color:#1a0906;border-color:var(--danger);}
  .tier-opt.tier-commit.active{border-color:var(--commit);background:var(--commit-dim);}
  .tier-opt.tier-commit.active .to-num{background:var(--commit);color:#04121e;border-color:var(--commit);}
  .tier-opt.tier-dirt.active{border-color:var(--dirt);background:var(--dirt-dim);}
  .tier-opt.tier-dirt.active .to-num{background:var(--dirt);color:#1a1004;border-color:var(--dirt);}
  .tier-opt.tier-violet.active{border-color:var(--violet);background:var(--violet-dim);}
  .tier-opt.tier-violet.active .to-num{background:var(--violet);color:#120820;border-color:var(--violet);}
  .tier-opt.tier-elsewhere.active{border-color:var(--elsewhere);background:var(--elsewhere-dim);}
  .tier-opt.tier-elsewhere.active .to-num{background:var(--elsewhere);color:#04121e;border-color:var(--elsewhere);}
  textarea.notes{
    width:100%;min-height:110px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:8px;color:var(--chalk);font-family:'Inter',sans-serif;font-size:13px;
    padding:12px;resize:vertical;line-height:1.5;
  }
  textarea.notes:focus{outline:none;border-color:var(--turf);}
  .save-hint{font-size:11px;color:var(--slate);margin-top:6px;display:flex;align-items:center;gap:6px;height:14px;}
  .save-hint.show svg{fill:var(--turf);}
  .save-hint svg{width:11px;height:11px;fill:transparent;transition:fill .15s;}
  .save-hint.warn{color:var(--danger);height:auto;line-height:1.4;}
  .save-hint.warn svg{display:none;}
  .topbar .sub.warn{color:var(--danger);border-left-color:rgba(193,84,59,0.4);font-weight:600;}
  /* ---- call log ---- */
  .log-add{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .log-add textarea{
    width:100%;min-height:62px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    color:var(--chalk);font-family:'Inter',sans-serif;font-size:13px;padding:10px 12px;resize:vertical;line-height:1.5;
  }
  .log-add textarea:focus{outline:none;border-color:var(--turf);}
  .log-add-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .log-add-row .hint{font-size:11px;color:var(--slate);}
  .btn-log{
    background:var(--turf);color:#08150b;border:none;border-radius:6px;padding:8px 15px;
    font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;flex-shrink:0;
  }
  .btn-log:hover{background:#5C9E6C;}
  .btn-log:disabled{opacity:.4;cursor:not-allowed;}
  .log-list{list-style:none;padding:0;margin:0;}
  .log-item{
    border-left:2px solid #39404f;padding:0 0 12px 12px;margin-bottom:12px;position:relative;
  }
  .log-item:last-child{margin-bottom:0;padding-bottom:0;}
  .log-item .lt{
    display:flex;align-items:baseline;gap:8px;margin-bottom:4px;
  }
  .log-item time{
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--turf);letter-spacing:0.02em;
  }
  .log-item .imported{
    font-size:9.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--dirt);
    border:1px solid rgba(193,122,59,0.4);background:var(--dirt-dim);border-radius:20px;padding:1px 7px;
  }
  .log-item .lx{
    margin-left:auto;background:none;border:none;color:var(--slate);cursor:pointer;font-size:14px;
    line-height:1;padding:0 3px;font-family:inherit;
  }
  .log-item .lx:hover{color:var(--danger);}
  .log-item .lx.arm{color:var(--danger);font-size:10.5px;font-weight:700;text-transform:uppercase;}
  .log-item p{margin:0;font-size:13px;color:#D3D8E2;white-space:pre-wrap;line-height:1.5;}
  .log-none{color:var(--slate);font-size:12.5px;padding:2px 0 4px;}
  .last-contact{
    font-size:11px;color:var(--slate);font-family:'JetBrains Mono',monospace;
    margin-left:auto;text-align:right;
  }
  /* ---- marks & measurables ---- */
  .pmarks{display:inline-flex;gap:3px;align-items:center;margin-left:5px;flex-shrink:0;}
  .pmark{font-size:12px;line-height:1;}
  .acad{
    font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;color:#8ecfa4;
    border:1px solid rgba(142,207,164,0.45);background:rgba(142,207,164,0.12);
    border-radius:4px;padding:1px 3px;letter-spacing:-0.02em;
  }
  .mx-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
  .mx{display:flex;flex-direction:column;gap:4px;}
  .mx label{font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--slate);}
  .mx input{
    background:var(--panel-2);border:1px solid var(--line);color:var(--chalk);border-radius:6px;
    padding:7px 8px;font-family:'JetBrains Mono',monospace;font-size:12.5px;width:100%;
  }
  .mx input:focus{outline:none;border-color:var(--turf);}
  .mx .u{font-size:9.5px;color:var(--slate);}
  .rule-row{
    display:flex;gap:7px;align-items:center;padding:8px;background:var(--panel-2);
    border:1px solid var(--line);border-radius:8px;margin-bottom:6px;flex-wrap:wrap;
  }
  .rule-row select,.rule-row input{
    background:var(--bg);border:1px solid var(--line);color:var(--chalk);border-radius:6px;
    padding:6px 8px;font-family:inherit;font-size:12.5px;
  }
  .rule-row input.val{width:76px;font-family:'JetBrains Mono',monospace;}
  .rule-row input.emo{width:54px;text-align:center;font-size:15px;}
  .rule-row select:focus,.rule-row input:focus{outline:none;border-color:var(--turf);}
  .rule-x{background:none;border:none;color:var(--slate);cursor:pointer;font-size:14px;margin-left:auto;}
  .rule-x:hover{color:var(--danger);}
  .rule-hits{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--turf);}
  /* ---- merge duplicates ---- */
  .mg-pair{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:10px;}
  .mg-why{font-size:11px;color:var(--dirt);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;}
